<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Rep0rt — an open record of null results</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/rep0rt.css" />
<style>
  .lede { display:flex; align-items:baseline; justify-content:space-between; gap:1.5rem; flex-wrap:wrap; margin-top:2rem; }
  .lede p { font-size:15px; color:var(--muted); margin:0; max-width:44ch; }

  .bar { display:flex; gap:10px; margin-top:2rem; }
  .search-wrap { position:relative; flex:1; }
  .search-wrap svg { position:absolute; left:12px; top:50%; transform:translateY(-50%); width:16px; height:16px; color:var(--hint); pointer-events:none; }
  #search {
    width:100%; background:var(--surface); color:var(--ink);
    border:0.5px solid var(--line-strong); border-radius:var(--radius);
    padding:0.6rem 0.75rem 0.6rem 2.1rem; font:inherit; font-size:14px; outline:none;
    transition:border-color .12s, box-shadow .12s;
  }
  #search:focus { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-bg); }
  #discipline-filter {
    background:var(--surface); color:var(--ink); border:0.5px solid var(--line-strong);
    border-radius:var(--radius); padding:0.6rem 0.75rem; font:inherit; font-size:14px;
    outline:none; cursor:pointer; max-width:190px; transition:border-color .12s, box-shadow .12s;
  }
  #discipline-filter:focus { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-bg); }

  .count { font-size:12px; color:var(--hint); margin:0.9rem 0 0; }

  .cards { display:grid; gap:1rem; margin-top:1rem; }
  .card {
    display:block; background:var(--surface); border:0.5px solid var(--line); border-radius:14px;
    padding:1.25rem 1.4rem; text-decoration:none; color:inherit; cursor:pointer;
    transition:border-color .12s, transform .06s;
  }
  .card:hover { border-color:var(--line-strong); }
  .card:active { transform:scale(0.995); }
  .card-top { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:0.6rem; }
  .card h2 { font-family:"EB Garamond", Georgia, serif; font-weight:500; font-style:italic; font-size:19px; line-height:1.35; margin:0 0 0.5rem; color:var(--ink); }
  .card-meta { display:flex; flex-wrap:wrap; gap:6px 10px; font-size:13px; color:var(--muted); align-items:center; }
  .card-meta .dot { color:var(--hint); }
  .card-tags { display:flex; flex-wrap:wrap; gap:6px; margin-top:0.7rem; }
  .tag { font-size:11.5px; color:var(--muted); background:var(--paper); border:0.5px solid var(--line); border-radius:6px; padding:2px 8px; }

  .empty { text-align:center; color:var(--hint); font-size:14px; padding:2.5rem 0; }
  @media (max-width:560px) { .bar { flex-direction:column; } #discipline-filter { max-width:none; } }
</style>
</head>
<body>
<div class="wrap">

  <header class="site">
    <span class="mark">Rep<span class="z">0</span>rt</span>
    <span class="meta">share what would otherwise be lost</span>
  </header>

  <section class="lede">
    <p>An open, citable record of results that didn't confirm the hypothesis — so the field stops repeating them.</p>
    <a class="cta" href="submit.html">Publish a result</a>
  </section>

  <div class="bar">
    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input type="text" id="search" placeholder="Search title, author, or tags…" autocomplete="off" />
    </div>
    <select id="discipline-filter" aria-label="Filter by discipline">
      <option value="">All disciplines</option>
    </select>
  </div>

  <p class="count" id="count"></p>

  <div class="cards" id="cards"></div>
  <p class="empty" id="empty" hidden>No reports match your search.</p>

  <p class="foot">Every result has the bones of a paper, even the ones that never get published.</p>

</div>

<script src="assets/reports-data.js"></script>
<script src="assets/index.js"></script>
</body>
</html>
